<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Stopky a výkony</title>
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Výkony">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0f1216;
  --surface:#191e25;
  --surface-2:#222932;
  --line:#2e3742;
  --ink:#eef2f6;
  --muted:#8d9aab;
  --signal:#ffd400;      /* stopky, primární akce */
  --go:#3ddc84;          /* start */
  --stop:#ff4d3d;        /* stop, mazání */
  --lane:#ffffff;
  --radius:14px;
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:400 17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.02em}

/* ---------- kostra ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
#topbar{
  display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  border-bottom:1px solid var(--line);background:var(--bg);
  position:sticky;top:0;z-index:5;
}
#topbar h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px}
#tabs{
  display:grid;grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--line);background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabs button{
  padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--muted);letter-spacing:-.01em;
}
#tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="true"]{color:var(--signal)}

/* ---------- obecné prvky ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.stack>*+*{margin-top:10px}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}

label.field{display:block;margin-bottom:12px}
label.field>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;min-height:48px;appearance:none;
}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%238d9aab' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
textarea{min-height:90px;resize:vertical}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:0 18px;border-radius:13px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--line);width:100%}
.btn.primary{background:var(--signal);color:#151006;border-color:transparent}
.btn.go{background:var(--go);color:#04220f;border-color:transparent}
.btn.danger{background:transparent;color:var(--stop);border-color:#4a2622}
.btn.ghost{background:transparent}
.btn.slim{min-height:44px;font-size:15px;padding:0 14px;width:auto}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);font-size:14.5px;color:var(--muted);min-height:40px;display:flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--signal);color:#151006;border-color:transparent;font-weight:600}

.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.badge.pb{background:var(--signal);color:#151006}
.badge.g1{background:#1e7a4d;color:#eafff3}
.badge.g2{background:#2f6b46}
.badge.g3{background:#6b5c1f;color:#fff6d0}
.badge.g4{background:#7a4a22;color:#ffe9d6}
.badge.g5{background:#7a2b24;color:#ffdfdb}

.empty{text-align:center;padding:38px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px;font-size:18px}

/* seznamy – dráhové linky */
.list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);min-height:60px;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface-2)}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13px;color:var(--muted)}
.rank{width:30px;text-align:right;color:var(--muted);font-weight:700}
.rank.m1{color:var(--signal)}
.val{font-weight:700;font-size:18px}

/* ---------- stopky ---------- */
.clock{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(52px,17vw,74px);font-weight:700;letter-spacing:-.03em;
  text-align:center;line-height:1;padding:18px 0 6px;color:var(--signal);
}
.clock.idle{color:var(--muted)}
.clock .ms{font-size:.55em;opacity:.85}
.bigbtn{
  width:100%;min-height:132px;border-radius:20px;font-size:26px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;letter-spacing:-.02em;
}
.bigbtn .hint{font-size:13.5px;font-weight:500;opacity:.75}
.bigbtn.go{background:var(--go);color:#04220f}
.bigbtn.mark{background:var(--lane);color:#0f1216}
.countdown{font-size:96px;font-weight:800;text-align:center;color:var(--signal);line-height:1.1;padding:24px 0}
.splitline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.splitline:last-child{border-bottom:0}
.splitline .no{width:26px;color:var(--muted);font-weight:700;text-align:right}
.splitline .t{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-weight:700;font-size:19px;min-width:92px}
.splitline select{min-height:44px;padding:8px 32px 8px 10px;font-size:15px}
.iconbtn{width:44px;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:11px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.iconbtn.danger{color:var(--stop)}

/* pokusy */
.attempts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.attempt{position:relative}
.attempt input{text-align:center;padding-right:13px}
.attempt .lbl{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:4px}
.attempt.void input{color:var(--stop);text-decoration:line-through}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
  max-height:92dvh;display:flex;flex-direction:column}
#sheet.on{transform:translateY(0)}
#sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#sheet header h2{font-size:18px;flex:1}
#sheet .body{overflow-y:auto;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
.grabber{width:38px;height:4px;background:var(--line);border-radius:2px;margin:8px auto 0}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,14px);
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  padding:11px 16px;border-radius:12px;font-size:15px;z-index:40;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar"><h1 id="title">Měření</h1><div id="topaction"></div></div>
  <main id="view"></main>
  <nav id="tabs"></nav>
</div>
<div id="scrim"></div>
<div id="sheet"><div class="grabber"></div><header><h2></h2><button class="iconbtn" data-act="close-sheet" aria-label="Zavřít">✕</button></header><div class="body"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ============================================================
   Stopky a výkony — lokální aplikace pro měření atletických disciplín
   Vše běží v prohlížeči, data jsou v localStorage zařízení.
   ============================================================ */

/* ---------- pomocné ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const czDate = iso => { const p = String(iso || '').split('-'); return p.length === 3 ? `${+p[2]}. ${+p[1]}. ${p[0]}` : iso; };

/* ---------- úložiště ---------- */
const KEY = 'vykony.db.v1';
/* Adresa nasazené Apps Script webové aplikace u Google tabulky. */
const GS_URL = 'https://script.google.com/macros/s/AKfycbxwbvyj15UqhQ12m5xj1HF-P6dikB2A0Fy2r7oKVo-I2Z0aq4UYwa_K7As-aor70lvkCw/exec';
let storageOK = true;

function readStore() { try { return localStorage.getItem(KEY); } catch (e) { storageOK = false; return null; } }
function writeStore(v) { try { localStorage.setItem(KEY, v); return true; } catch (e) { storageOK = false; return false; } }

/* Známkové limity podle pohlaví a ročníku (1.–4. = 15–18 let).
   Pole [známka 1, známka 2, známka 3]; horší výkon = 4 (zúčastnil se).
   Časy jsou v sekundách, výkony v jednotce disciplíny. Zdroje a úvahy viz dokumentace. */
function seedDisciplines() {
  const D = [];
  const add = (name, type, unit, dec, attempts, better, M, F) => D.push({
    id: uid(), name, type, unit, dec, attempts, better,
    scale: (M || F) ? { M: M || null, F: F || null } : null
  });

  add('50 m', 'time', 's', 2, 1, 'lower',
    [[8.00, 8.70, 9.40], [7.90, 8.55, 9.25], [7.75, 8.40, 9.10], [7.65, 8.30, 9.00]],
    [[8.70, 9.40, 10.10], [8.60, 9.30, 10.00], [8.55, 9.25, 9.95], [8.55, 9.25, 9.95]]);
  add('60 m', 'time', 's', 2, 1, 'lower',
    [[9.20, 10.00, 10.80], [9.00, 9.80, 10.60], [8.80, 9.60, 10.40], [8.70, 9.50, 10.30]],
    [[10.00, 10.80, 11.60], [9.90, 10.70, 11.50], [9.80, 10.60, 11.40], [9.80, 10.60, 11.40]]);
  add('100 m', 'time', 's', 2, 1, 'lower',
    [[14.50, 15.80, 17.20], [14.20, 15.50, 16.90], [14.00, 15.20, 16.60], [13.80, 15.00, 16.40]],
    [[16.30, 17.60, 19.00], [16.10, 17.40, 18.80], [16.00, 17.30, 18.70], [16.00, 17.30, 18.70]]);
  add('300 m', 'time', 's', 1, 1, 'lower',
    [[48, 55, 62], [47, 54, 61], [46, 53, 60], [45, 52, 59]],
    [[55, 63, 71], [54, 62, 70], [54, 62, 70], [54, 62, 70]]);
  add('800 m', 'time', 's', 1, 1, 'lower',
    [[165, 190, 220], [162, 187, 216], [158, 183, 212], [155, 180, 210]],
    [[200, 230, 260], [198, 228, 258], [196, 226, 256], [196, 226, 256]]);
  add('1500 m', 'time', 's', 1, 1, 'lower',
    [[360, 410, 470], [350, 400, 460], [340, 390, 450], [335, 385, 445]],
    [[435, 495, 555], [432, 492, 552], [430, 490, 550], [430, 490, 550]]);
  add('Člunkový běh 4×10 m', 'time', 's', 1, 2, 'lower',
    [[10.8, 11.6, 12.4], [10.7, 11.5, 12.3], [10.6, 11.4, 12.2], [10.5, 11.3, 12.1]],
    [[11.5, 12.4, 13.3], [11.4, 12.3, 13.2], [11.3, 12.2, 13.1], [11.3, 12.2, 13.1]]);

  add('Skok daleký', 'measure', 'cm', 0, 3, 'higher',
    [[420, 360, 300], [430, 370, 310], [440, 380, 320], [450, 385, 325]],
    [[350, 300, 250], [355, 305, 255], [360, 310, 260], [360, 310, 260]]);
  add('Skok vysoký', 'measure', 'cm', 0, 3, 'higher',
    [[140, 125, 110], [145, 130, 115], [150, 133, 117], [150, 135, 120]],
    [[120, 108, 95], [122, 110, 97], [125, 112, 100], [125, 112, 100]]);
  add('Skok daleký z místa', 'measure', 'cm', 0, 3, 'higher',
    [[225, 195, 165], [230, 200, 170], [235, 205, 175], [240, 208, 178]],
    [[180, 155, 130], [182, 157, 132], [185, 160, 135], [185, 160, 135]]);
  add('Vrh koulí', 'measure', 'm', 2, 3, 'higher',
    [[8.50, 7.00, 5.50], [9.00, 7.50, 6.00], [9.50, 8.00, 6.50], [10.00, 8.30, 6.80]],
    [[7.00, 5.80, 4.60], [7.30, 6.00, 4.80], [7.50, 6.20, 5.00], [7.50, 6.20, 5.00]]);
  add('Hod míčkem', 'measure', 'm', 1, 3, 'higher',
    [[48, 38, 28], [52, 41, 30], [55, 44, 33], [57, 45, 34]],
    [[28, 22, 16], [29, 23, 17], [30, 24, 18], [30, 24, 18]]);
  add('Cooperův test (12 min)', 'measure', 'm', 0, 1, 'higher',
    [[2400, 2050, 1700], [2450, 2100, 1750], [2500, 2150, 1800], [2500, 2150, 1800]],
    [[2000, 1700, 1400], [2020, 1720, 1420], [2050, 1750, 1450], [2050, 1750, 1450]]);
  add('Shyby', 'measure', 'opak.', 0, 1, 'higher',
    [[8, 5, 2], [9, 6, 3], [10, 7, 3], [11, 7, 4]], null);
  add('Výdrž ve shybu', 'measure', 's', 0, 1, 'higher', null,
    [[20, 10, 4], [21, 11, 4], [22, 12, 5], [22, 12, 5]]);
  add('Leh-sedy za 1 min', 'measure', 'opak.', 0, 1, 'higher',
    [[45, 38, 30], [47, 40, 32], [48, 41, 33], [48, 41, 33]],
    [[40, 33, 26], [41, 34, 27], [42, 35, 28], [42, 35, 28]]);
  return D;
}

const YEARS = [1, 2, 3, 4];
const yearLabel = y => y ? y + '. ročník' : 'ročník nezadán';
const sexLabel = x => x === 'M' ? 'chlapec' : (x === 'F' ? 'dívka' : 'pohlaví nezadáno');
function yearFromGroup(g) {
  const m = String(g || '').match(/(\d)/);
  return m && +m[1] >= 1 && +m[1] <= 4 ? +m[1] : null;
}
function emptyScaleRows() { return [[null, null, null], [null, null, null], [null, null, null], [null, null, null]]; }

function freshDB() {
  return {
    v: 4,
    athletes: [],
    disciplines: seedDisciplines(),
    results: [],
    settings: { sound: true, countdown: 0, awake: true, lastGroup: '', email: '',
      gsUrl: GS_URL, gsAuto: true, gsLast: '',
      gsSheet: 'https://docs.google.com/spreadsheets/d/1KPsHM_cYwhb_cKvOa_pmqPV36Lu_r-j1hIusruUktzE' }
  };
}

let DB;
(function loadDB() {
  const raw = readStore();
  if (!raw) { DB = freshDB(); return; }
  try {
    const d = JSON.parse(raw);
    DB = Object.assign(freshDB(), d);
    DB.settings = Object.assign(freshDB().settings, d.settings || {});
    if ((d.v || 1) < 2) { DB.settings.countdown = 0; DB.v = 2; }   // start je nově okamžitý
    if ((d.v || 1) < 3) {                                          // doplnění adresy tabulky
      if (!DB.settings.gsUrl) DB.settings.gsUrl = GS_URL;
      DB.settings.gsAuto = true; DB.v = 3;
    }
    if ((d.v || 1) < 4) {                                          // pohlaví, ročník, známkové tabulky
      const def = seedDisciplines();
      DB.disciplines.forEach(x => {
        const m = def.find(y => y.name === x.name);
        if (m) { x.scale = m.scale; x.dec = x.dec ?? m.dec; }
        else if (!x.scale) x.scale = null;
        delete x.grades;
      });
      def.forEach(y => { if (!DB.disciplines.some(x => x.name === y.name)) DB.disciplines.push(y); });
      DB.athletes.forEach(a => {
        if (a.sex !== 'M' && a.sex !== 'F') a.sex = '';
        if (!a.year) a.year = yearFromGroup(a.group);
      });
      DB.v = 4;
    }
  } catch (e) { DB = freshDB(); }
})();

let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => writeStore(JSON.stringify(DB)), 120);
  if (typeof gsSchedule === 'function') gsSchedule();
}

/* ---------- formátování hodnot ---------- */
function fmtTime(ms, dec = 2) {
  if (ms == null || isNaN(ms)) return '—';
  const p = Math.pow(10, dec);
  const t = Math.round(ms / 1000 * p) / p;
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  const ss = s.toFixed(dec);
  return (m > 0 ? m + ':' + (s < 10 ? '0' : '') + ss : ss).replace('.', ',');
}
function fmtNum(v, dec = 2) {
  if (v == null || isNaN(v)) return '—';
  return Number(v).toFixed(dec).replace('.', ',');
}
function fmtValue(d, v) {
  if (v == null || isNaN(v)) return '—';
  return d.type === 'time' ? fmtTime(v, d.dec) : fmtNum(v, d.dec) + (d.unit ? ' ' + d.unit : '');
}
function fmtValuePlain(d, v) { // do CSV, bez jednotky
  if (v == null || isNaN(v)) return '';
  return d.type === 'time' ? fmtTime(v, d.dec) : fmtNum(v, d.dec);
}
function parseTime(str) {
  if (str == null) return null;
  let s = String(str).trim().replace(',', '.').replace(/\s/g, '');
  if (!s) return null;
  let m = s.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);
  if (m) return (parseInt(m[1], 10) * 60 + parseFloat(m[2])) * 1000;
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s) * 1000;
}
function parseNum(str) {
  if (str == null) return null;
  const s = String(str).trim().replace(',', '.');
  if (!s || !/^-?\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s);
}
function parseValue(d, str) { return d.type === 'time' ? parseTime(str) : parseNum(str); }

/* ---------- práce s daty ---------- */
const athleteById = id => DB.athletes.find(a => a.id === id);
const discById = id => DB.disciplines.find(d => d.id === id);
const fullName = a => a ? ((a.first || '') + ' ' + (a.last || '')).trim() : '—';
const sortName = a => ((a.last || '') + ' ' + (a.first || '')).trim().toLowerCase();

function groups() {
  const g = new Set(DB.athletes.map(a => (a.group || '').trim()).filter(Boolean));
  return Array.from(g).sort((a, b) => a.localeCompare(b, 'cs'));
}
function athletesIn(group) {
  const list = DB.athletes.filter(a => !group || (a.group || '') === group);
  return list.sort((a, b) => sortName(a).localeCompare(sortName(b), 'cs'));
}
function isBetter(d, a, b) { // je a lepší než b?
  if (b == null) return true;
  return d.better === 'lower' ? a < b : a > b;
}
function bestResult(athleteId, discId) {
  const d = discById(discId);
  if (!d) return null;
  let best = null;
  for (const r of DB.results) {
    if (r.athleteId !== athleteId || r.discId !== discId) continue;
    if (!best || isBetter(d, r.value, best.value)) best = r;
  }
  return best;
}
/* Známka podle pohlaví a ročníku závodníka. 1–3 podle limitů, 4 = zúčastnil se. */
function gradeFor(d, v, a) {
  if (!d || !d.scale || v == null || !a || !a.sex || !a.year) return null;
  const row = (d.scale[a.sex] || [])[a.year - 1];
  if (!row || !row.some(x => x != null)) return null;
  const x = d.type === 'time' ? v / 1000 : v;
  for (let i = 0; i < 3; i++) {
    const th = row[i];
    if (th == null || isNaN(th)) continue;
    if (d.better === 'lower' ? x <= th : x >= th) return i + 1;
  }
  return 4;
}
function gradeBadge(d, v, a) {
  const g = gradeFor(d, v, a);
  return g ? `<span class="badge g${g}">${g}</span>` : '';
}
/* kolik závodníků nemá vyplněné pohlaví nebo ročník */
function missingProfile(group) {
  return athletesIn(group).filter(a => !a.sex || !a.year).length;
}
function addResult(o) {
  const d = discById(o.discId);
  const prev = bestResult(o.athleteId, o.discId);
  const r = Object.assign({
    id: uid(), date: state.date, session: state.session || '',
    attempts: null, note: '', created: Date.now()
  }, o);
  DB.results.push(r);
  save();
  return { result: r, isPB: !prev || isBetter(d, r.value, prev.value), prev };
}

/* ---------- zvuk, vibrace, displej ---------- */
let actx = null;
function beep(freq = 880, dur = 70, vol = .25) {
  if (!DB.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur / 1000);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur / 1000 + .02);
  } catch (e) { }
}
function haptic() { try { navigator.vibrate && navigator.vibrate(18); } catch (e) { } }

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
    else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && sw.phase === 'running' && DB.settings.awake) keepAwake(true);
});

/* ============================================================
   STOPKY
   ============================================================ */
const sw = { phase: 'idle', t0: 0, elapsed: 0, splits: [], lineup: [], raf: 0, cdVal: 0, cdTimer: 0 };

function swReset() {
  cancelAnimationFrame(sw.raf);
  clearInterval(sw.cdTimer);
  sw.phase = 'idle'; sw.t0 = 0; sw.elapsed = 0; sw.splits = [];
  keepAwake(false);
}
function swTick() {
  sw.elapsed = performance.now() - sw.t0;
  const el = $('#clock');
  if (el) el.innerHTML = clockHTML(sw.elapsed);
  sw.raf = requestAnimationFrame(swTick);
}
function clockHTML(ms) {
  const d = discById(state.discId);
  const dec = d ? d.dec : 2;
  const t = Math.max(0, ms) / 1000;
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  const whole = Math.floor(s);
  const frac = (s - whole).toFixed(dec).slice(1).replace('.', ',');
  const head = (m > 0 ? m + ':' + (whole < 10 ? '0' : '') + whole : String(whole));
  return `${head}<span class="ms">${frac}</span>`;
}
function swStart() {
  const cd = Number(DB.settings.countdown) || 0;
  if (DB.settings.awake) keepAwake(true);
  if (cd > 0) {
    sw.phase = 'countdown'; sw.cdVal = cd; render();
    beep(660, 90);
    sw.cdTimer = setInterval(() => {
      sw.cdVal--;
      if (sw.cdVal > 0) { beep(660, 90); const e = $('#cd'); if (e) e.textContent = sw.cdVal; }
      else {
        clearInterval(sw.cdTimer);
        beep(1320, 220, .3);
        swGo();
      }
    }, 1000);
  } else { beep(1320, 180, .3); swGo(); }
}
function swGo() {
  sw.phase = 'running'; sw.t0 = performance.now(); sw.elapsed = 0; sw.splits = [];
  render();
  sw.raf = requestAnimationFrame(swTick);
}
function swMark() {
  if (sw.phase !== 'running') return;
  const ms = performance.now() - sw.t0;
  const idx = sw.splits.length;
  sw.splits.push({ id: uid(), ms, athleteId: sw.lineup[idx] || null });
  beep(1000, 55, .2); haptic();
  renderSplitsLive();
}
function swUndo() {
  if (!sw.splits.length) return;
  sw.splits.pop();
  beep(400, 60, .15);
  sw.phase === 'running' ? renderSplitsLive() : render();
}
function swStop() {
  cancelAnimationFrame(sw.raf);
  sw.elapsed = performance.now() - sw.t0;
  sw.phase = 'review';
  keepAwake(false);
  beep(520, 160, .25);
  render();
}
function swSave() {
  const d = discById(state.discId);
  const filled = sw.splits.filter(s => s.athleteId);
  if (!filled.length) { toast('Nejdřív přiřaď čas alespoň jednomu závodníkovi.'); return; }
  const ids = filled.map(s => s.athleteId);
  const dup = ids.find((id, i) => ids.indexOf(id) !== i);
  const finish = () => {
    let pbs = 0;
    filled.forEach(s => {
      const res = addResult({ athleteId: s.athleteId, discId: d.id, value: Math.round(s.ms) });
      if (res.isPB) pbs++;
    });
    const skipped = sw.splits.length - filled.length;
    swReset();
    render();
    toast(`Uloženo ${filled.length} × ${d.name}` + (pbs ? ` · ${pbs}× osobní rekord` : '') + (skipped ? ` · ${skipped} nepřiřazeno` : ''));
  };
  if (dup) {
    confirmSheet('Stejný závodník dvakrát', `${fullName(athleteById(dup))} má přiřazené dva časy. Uložit i tak?`, 'Uložit', finish);
  } else finish();
}

/* ---------- ZNÁMKOVACÍ TABULKA ---------- */
let scaleDraft = null;

function scaleSheet(id, sex) {
  const d = discById(id);
  if (!d) return;
  if (!scaleDraft || scaleDraft.discId !== id) {
    const cp = k => (d.scale && d.scale[k]) ? d.scale[k].map(r => (r || []).slice(0, 3)) : emptyScaleRows();
    scaleDraft = { discId: id, M: cp('M'), F: cp('F'), sex: 'M' };
  }
  if (sex) scaleDraft.sex = sex;
  const rows = scaleDraft[scaleDraft.sex];
  const val = v => v == null ? '' : fmtValuePlain(d, d.type === 'time' ? v * 1000 : v);
  const unit = d.type === 'time' ? (d.dec >= 2 ? 's, např. 9,20' : 's nebo mm:ss, např. 6:10') : d.unit;

  openSheet('Známky · ' + d.name, `
    <div class="chips" style="margin:0 0 6px">
      ${[['M', 'Chlapci'], ['F', 'Dívky']].map(([v, l]) =>
        `<button class="chip" data-act="scale-sex" data-id="${id}" data-v="${v}" aria-pressed="${scaleDraft.sex === v}">${l}</button>`).join('')}
    </div>
    <p class="muted tiny" style="margin:0 0 14px">Hodnoty v ${esc(unit)}. ${d.better === 'lower' ? 'Stačí být pod limitem' : 'Je potřeba limit překonat'}. Prázdné pole = ročník se neznámkuje. Kdo se zúčastní a na 3 nedosáhne, má 4.</p>
    <div class="row tiny muted" style="gap:8px;padding-left:78px">
      <span style="flex:1;text-align:center">na 1</span><span style="flex:1;text-align:center">na 2</span><span style="flex:1;text-align:center">na 3</span></div>
    ${YEARS.map(y => `<div class="row" style="gap:8px;margin-top:8px">
        <span class="tiny muted" style="width:70px">${y}. roč.<br>${14 + y} let</span>
        ${[0, 1, 2].map(i => `<input class="sc" data-y="${y}" data-i="${i}" type="text" inputmode="decimal"
          value="${esc(val(rows[y - 1] ? rows[y - 1][i] : null))}" placeholder="—" style="flex:1;text-align:center;padding:10px 6px">`).join('')}
      </div>`).join('')}
    <button class="btn primary" data-act="scale-save" data-id="${id}" style="margin-top:18px">Uložit tabulku</button>
    <button class="btn ghost" data-act="scale-clear" data-id="${id}" style="margin-top:10px">Vymazat sloupec ${scaleDraft.sex === 'M' ? 'chlapců' : 'dívek'}</button>`);
}

function scaleCollect() {
  if (!scaleDraft) return;
  const d = discById(scaleDraft.discId);
  const rows = emptyScaleRows();
  $$('#sheet .sc').forEach(inp => {
    const y = Number(inp.dataset.y), i = Number(inp.dataset.i);
    const raw = inp.value.trim();
    if (!raw) { rows[y - 1][i] = null; return; }
    const v = parseValue(d, raw);
    rows[y - 1][i] = v == null ? null : (d.type === 'time' ? v / 1000 : v);
  });
  scaleDraft[scaleDraft.sex] = rows;
}

  openSheet(fullName(a), `

      ${b ? `<span class="badge">osobní nej ${fmtValue(d, b.value)}</span>` : ''}</div>
    ${fields}
    <div class="btn-row" style="margin-top:18px">
      ${next ? `<button class="btn" data-act="entry-save" data-id="${athleteId}" data-next="${next.id}">Uložit a další</button>` : ''}
      <button class="btn primary" data-act="entry-save" data-id="${athleteId}">Uložit</button>
    </div>
    ${existing ? `<button class="btn danger" data-act="res-del" data-id="${existing.id}" style="margin-top:10px">Smazat dnešní zápis</button>` : ''}`,
    body => setTimeout(() => { const f = $('.att', body); if (f) { f.focus(); f.select && f.select(); } }, 250));
}

function entrySave(athleteId, nextId) {
  const d = discById(state.discId);
  const inputs = $$('#sheet .att');
  const attempts = inputs.map(i => {
    const raw = i.value.trim();
    if (!raw || /^[xX-]$/.test(raw)) return null;
    return parseValue(d, raw);
  });
  const valid = attempts.filter(v => v != null && !isNaN(v));
  if (!valid.length) { toast('Zadej alespoň jeden platný pokus.'); return; }
  const best = valid.reduce((m, v) => isBetter(d, v, m) ? v : m, valid[0]);
  const value = d.type === 'time' ? Math.round(best) : best;
  const existing = DB.results.filter(r => r.athleteId === athleteId && r.discId === d.id && r.date === state.date)
    .sort((x, y) => y.created - x.created)[0];
  let pb = false;
  if (existing) {
    existing.value = value; existing.attempts = attempts; existing.session = state.session || existing.session;
    save();
  } else {
    const res = addResult({ athleteId, discId: d.id, value, attempts });
    pb = res.isPB && DB.results.filter(r => r.athleteId === athleteId && r.discId === d.id).length > 1;
  }
  toast(fullName(athleteById(athleteId)) + ' · ' + fmtValue(d, value) + (pb ? ' · osobní rekord!' : ''));
  if (pb) beep(1320, 200, .25);
  render();
  if (nextId) entrySheet(nextId); else closeSheet();
}

/* ============================================================
   CSV / ZÁLOHY
   ============================================================ */
function parseCSV(text) {
  text = String(text).replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const cnt = { ';': (first.match(/;/g) || []).length, ',': (first.match(/,/g) || []).length, '\t': (first.match(/\t/g) || []).length };
  const delim = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || ';';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); cur = ''; rows.push(row); row = []; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
const noAcc = s => String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const hasHeaderGroup = head => head.some(h => ['trida', 'skupina', 'group', 'class', 'kategorie'].includes(h));
function parseSex(v) {
  const x = noAcc(v);
  if (['m', 'ch', 'chlapec', 'muz', 'kluk', 'h', 'hoch', 'boy', 'male'].includes(x)) return 'M';
  if (['z', 'f', 'd', 'divka', 'zena', 'holka', 'girl', 'female', 'w'].includes(x)) return 'F';
  return '';
}

function importAthletes(text, forcedGroup) {
  const rows = parseCSV(text);
  if (!rows.length) return 0;
  const head = rows[0].map(noAcc);
  const known = ['jmeno', 'prijmeni', 'trida', 'skupina', 'name', 'first', 'last', 'group', 'class',
    'rocnik', 'zavodnik', 'poznamka', 'pohlavi', 'sex', 'gender'];
  const hasHeader = head.some(h => known.includes(h));
  const idx = { first: -1, last: -1, group: -1, note: -1, sex: -1, year: -1 };
  if (hasHeader) head.forEach((h, i) => {
    if (['jmeno', 'krestni', 'first', 'firstname'].includes(h)) idx.first = i;
    else if (['prijmeni', 'last', 'lastname', 'surname'].includes(h)) idx.last = i;
    else if (['pohlavi', 'sex', 'gender'].includes(h)) idx.sex = i;
    else if (['rocnik', 'year'].includes(h)) idx.year = i;
    else if (['trida', 'skupina', 'group', 'class', 'kategorie'].includes(h)) idx.group = i;
    else if (['poznamka', 'note'].includes(h)) idx.note = i;
    else if (['name', 'zavodnik', 'cele jmeno'].includes(h) && idx.first < 0) idx.first = i;
  });
  if (idx.group < 0 && idx.year >= 0 && !hasHeaderGroup(head)) idx.group = idx.year;
  const data = hasHeader ? rows.slice(1) : rows;
  let n = 0;
  data.forEach(r => {
    let first = '', last = '', group = forcedGroup || '', note = '', sex = '', year = null;
    if (hasHeader) {
      first = (idx.first >= 0 ? r[idx.first] || '' : r[0] || '').trim();
      last = (idx.last >= 0 ? r[idx.last] || '' : '').trim();
      if (idx.group >= 0 && !forcedGroup) group = (r[idx.group] || '').trim();
      if (idx.note >= 0) note = (r[idx.note] || '').trim();
      if (idx.sex >= 0) sex = parseSex(r[idx.sex]);
      if (idx.year >= 0) year = yearFromGroup(r[idx.year]);
    } else if (r.length === 1) {
      first = (r[0] || '').trim();
    } else {
      first = (r[0] || '').trim(); last = (r[1] || '').trim();
      if (!forcedGroup) group = (r[2] || '').trim();
    }
    if (!last && first.includes(' ')) {
      const p = first.split(/\s+/);
      last = p.pop(); first = p.join(' ');
    }
    if (!first && !last) return;
    if (DB.athletes.some(a => a.first === first && a.last === last && (a.group || '') === (group || ''))) return;
    DB.athletes.push({ id: uid(), first, last, group, note, sex, year: year || yearFromGroup(group) });
    n++;
  });
  save();
  return n;
}

function toCSV(rows) {
  return '\uFEFF' + rows.map(r => r.map(c => {
    const s = String(c ?? '');
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
}
function download(name, text, mime = 'text/csv') {
  try {
    const blob = new Blob([text], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('Soubor ' + name + ' je stažený.');
  } catch (e) { toast('Stažení se nepovedlo.'); }
}
function readFile(file, cb) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const buf = fr.result;
    let txt;
    try { txt = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { try { txt = new TextDecoder('windows-1250').decode(buf); } catch (e2) { txt = new TextDecoder().decode(buf); } }
    cb(txt);
  };
  fr.readAsArrayBuffer(file);
}
function resultRows(results) {
  const head = ['Datum', 'Skupina', 'Příjmení', 'Jméno', 'Pohlaví', 'Ročník', 'Disciplína', 'Výkon', 'Jednotka', 'Známka', 'Pokusy', 'Označení', 'Poznámka'];
  const rows = results.map(r => {
    const a = athleteById(r.athleteId) || {}, d = discById(r.discId) || {};
    const g = gradeFor(d, r.value, a);
    return [r.date, a.group || '', a.last || '', a.first || '', sexLabel(a.sex), a.year || '', d.name || '', fmtValuePlain(d, r.value),
      d.type === 'time' ? 's' : (d.unit || ''), g || '',
      (r.attempts && r.attempts.length > 1) ? r.attempts.map(v => v == null ? 'x' : fmtValuePlain(d, v)).join(' / ') : '',
      r.session || '', r.note || ''];
  });
  return [head, ...rows];
}

function mergeDB(d) {
  const mapA = {}, mapD = {};
  (d.athletes || []).forEach(a => {
    const same = DB.athletes.find(x => x.id === a.id ||
      (x.first === a.first && x.last === a.last && (x.group || '') === (a.group || '')));
    if (same) mapA[a.id] = same.id;
    else { DB.athletes.push(a); mapA[a.id] = a.id; }
  });
  (d.disciplines || []).forEach(x => {
    const same = DB.disciplines.find(y => y.id === x.id || y.name === x.name);
    if (same) { mapD[x.id] = same.id; if (!same.grades && x.grades) same.grades = x.grades; }
    else { DB.disciplines.push(x); mapD[x.id] = x.id; }
  });
  let n = 0;
  (d.results || []).forEach(r => {
    const aid = mapA[r.athleteId], did = mapD[r.discId];
    if (!aid || !did) return;
    if (DB.results.some(z => z.id === r.id)) return;
    if (DB.results.some(z => z.athleteId === aid && z.discId === did && z.date === r.date && z.value === r.value)) return;
    DB.results.push(Object.assign({}, r, { athleteId: aid, discId: did }));
    n++;
  });
  save();
  return { results: n, athletes: DB.athletes.length, discs: DB.disciplines.length };
}

function gsScaleRows() {

  DB.disciplines.forEach(d => {

/* 1) přímý fetch – nejrychlejší, funguje, když Google pošle hlavičky CORS */
async function gsFetchPost(payload) {
  const res = await fetch((DB.settings.gsUrl || '').trim(), {
    method: 'POST', mode: 'cors', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload
  });
  const txt = await res.text();
  let j;
  try { j = JSON.parse(txt); }
  catch (e) { throw new Error('Skript nevrátil data.'); }
  if (!j.ok) throw new Error(j.error || 'Skript hlásí chybu.');
  return j;
}

/* 2) odeslání formulářem ve skrytém rámu – na formuláře se CORS nevztahuje,
      odpověď sice nepřečteme, ale data dorazí; potvrdí se dotazem na stav */
function gsFormPost(payload) {
  return new Promise((resolve, reject) => {
    const url = (DB.settings.gsUrl || '').trim();
    const name = 'gsf' + Math.random().toString(36).slice(2, 8);
    const frame = document.createElement('iframe');
    frame.name = name; frame.style.display = 'none';
    const form = document.createElement('form');
    form.method = 'POST'; form.action = url; form.target = name; form.style.display = 'none';
    const field = document.createElement('input');
    field.type = 'hidden'; field.name = 'payload'; field.value = payload;
    form.appendChild(field);
    document.body.appendChild(frame); document.body.appendChild(form);
    let done = false;
    const finish = fn => { if (done) return; done = true; clearTimeout(t); setTimeout(() => { form.remove(); frame.remove(); }, 600); fn(); };
    const t = setTimeout(() => finish(() => reject(new Error('Tabulka neodpověděla do 25 vteřin.'))), 25000);
    frame.addEventListener('load', () => finish(resolve));
    try { form.submit(); } catch (e) { finish(() => reject(new Error('Odeslání se nepodařilo spustit.'))); }
  });
}

/* 3) JSONP pro čtení – načte se jako skript, takže CORS nic neblokuje */
function gsJsonp(params, timeout) {
  return new Promise((resolve, reject) => {
    const url = (DB.settings.gsUrl || '').trim();
    if (!gsReady()) { reject(new Error('Vyplň adresu skriptu (končí na /exec).')); return; }
    const cb = 'gscb' + Math.random().toString(36).slice(2, 9);
    const q = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
    const el = document.createElement('script');
    let done = false;
    const cleanup = () => { try { delete window[cb]; } catch (e) { window[cb] = undefined; } el.remove(); clearTimeout(t); };
    const t = setTimeout(() => {
      if (done) return; done = true; cleanup();
      reject(new Error('Skript neodpověděl. Nasaď ho znovu s přístupem „Kdokoli“.'));
    }, timeout || 20000);
    window[cb] = data => {
      if (done) return; done = true; cleanup();
      if (!data || data.ok === false) reject(new Error((data && data.error) || 'Skript hlásí chybu.'));
      else resolve(data);
    };
    el.onerror = () => { if (done) return; done = true; cleanup(); reject(new Error('Adresa skriptu není dostupná.')); };
    el.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + q + '&callback=' + cb + '&t=' + Date.now();
    document.head.appendChild(el);
  });
}

async function gsPush(silent) {
  if (gs.busy || !gsReady()) return;
  gs.busy = true; gs.error = ''; if (!silent) render();
  const payload = JSON.stringify({ action: 'sync', sheets: gsSheetsPayload(), raw: JSON.stringify(DB) });
  const want = DB.results.length;
  try {
    let how = 'přímo';
    try {
      await gsFetchPost(payload);
    } catch (err) {
      await gsFormPost(payload);              // náhradní cesta bez CORS
      const st = await gsJsonp({ action: 'status' });
      if (st.results !== want) throw new Error(`Tabulka přijala ${st.results} z ${want} výkonů. Nasaď skript znovu jako novou verzi.`);
      how = 'formulářem';
    }
    DB.settings.gsLast = new Date().toISOString();
    gs.suspend = true; save(); gs.suspend = false;
    gs.warned = false;
    if (!silent) toast('Uloženo do tabulky (' + how + ').');
  } catch (e) {
    gs.error = e.message;
    if (!silent || !gs.warned) { toast('Tabulka: ' + e.message); gs.warned = true; }
  } finally {
    gs.busy = false;
    if (state.tab === 'settings') render();
  }
}

    case 'go-athletes': state.tab = 'athletes'; render(); break;

    /* měření */
    case 'pick-disc': state.discId = id; swReset(); render(); break;
    case 'change-disc':
      if (sw.phase === 'running' || sw.phase === 'review') {
        confirmSheet('Zahodit měření?', 'Zaznamenané časy nejsou uložené.', 'Zahodit', () => { swReset(); state.discId = null; render(); }, true);
      } else { swReset(); state.discId = null; render(); }
      break;
    case 'sw-start': swStart(); break;
    case 'sw-mark': swMark(); break;
    case 'sw-stop': swStop(); break;
    case 'sw-undo': swUndo(); break;
    case 'sw-cancel': swReset(); render(); break;
    case 'sw-save': swSave(); break;
    case 'sw-discard': confirmSheet('Zahodit měření?', 'Všechny zaznamenané časy zmizí.', 'Zahodit', () => { swReset(); render(); }, true); break;
    case 'lineup-toggle': {
      const i = sw.lineup.indexOf(id);
      if (i >= 0) sw.lineup.splice(i, 1); else sw.lineup.push(id);
      render(); break;
    }
    case 'lineup-clear': sw.lineup = []; render(); break;
    case 'split-time': splitEditSheet(id); break;
    case 'split-save': {
      const s = sw.splits.find(x => x.id === id);
      const ms = parseTime($('#sVal').value);
      if (ms == null) { toast('Čas nedává smysl. Zkus třeba 12,34.'); break; }
      s.ms = ms; closeSheet();
      sw.splits.sort((a, c) => a.ms - c.ms);
      $('#reviewSplits').innerHTML = reviewSplitsHTML();
      break;
    }
    case 'split-del':
      sw.splits = sw.splits.filter(x => x.id !== id);
      $('#reviewSplits').innerHTML = reviewSplitsHTML();
      break;
    case 'split-add':
      sw.splits.push({ id: uid(), ms: sw.elapsed || 0, athleteId: null });
      $('#reviewSplits').innerHTML = reviewSplitsHTML();
      splitEditSheet(sw.splits[sw.splits.length - 1].id);
      break;
    case 'manual-open': manualSheet(); break;
    case 'manual-save': {
      const d = discById(state.discId);
      const aId = $('#mAth').value, ms = parseTime($('#mVal').value);
      if (!aId || ms == null) { toast('Vyber závodníka a zadej platný čas.'); break; }
      const r = addResult({ athleteId: aId, discId: d.id, value: Math.round(ms) });
      toast(fullName(athleteById(aId)) + ' · ' + fmtTime(ms, d.dec) + (r.prev && r.isPB ? ' · osobní rekord!' : ''));
      $('#mVal').value = ''; $('#mVal').focus();
      break;
    }
    case 'entry-open': entrySheet(id); break;
    case 'entry-save': entrySave(id, b.dataset.next || null); break;

    /* závodníci */
    case 'ath-add': athDraft = null; athSheet(null); break;
    case 'ath-edit': athDraft = null; athSheet(id); break;
    case 'ath-sex':
    case 'ath-year': {
      const key = act === 'ath-sex' ? 'sex' : 'year';
      const v = act === 'ath-sex' ? b.dataset.v : (b.dataset.v ? Number(b.dataset.v) : null);
      athDraft = athDraft || {};
      athDraft[key] = v;
      const box = b.parentElement;
      Array.from(box.children).forEach(c => c.setAttribute('aria-pressed', String(c.dataset.v === b.dataset.v)));
      break;
    }
    case 'ath-save': {
      const first = $('#aFirst').value.trim(), last = $('#aLast').value.trim();
      const group = $('#aGroup').value.trim(), note = $('#aNote').value.trim();
      if (!first && !last) { toast('Vyplň aspoň jedno jméno.'); break; }
      const cur = id ? athleteById(id) : null;
      const d = athDraft || {};
      const sex = d.sex !== undefined ? d.sex : (cur ? cur.sex || '' : '');
      const year = d.year !== undefined ? d.year : (cur ? cur.year : yearFromGroup(group));
      if (cur) Object.assign(cur, { first, last, group, note, sex, year });
      else DB.athletes.push({ id: uid(), first, last, group, note, sex, year });
      athDraft = null;
      DB.settings.lastGroup = group; save(); closeSheet(); render();
      toast(id ? 'Uloženo.' : fullName({ first, last }) + ' přidán.');
      break;
    }
    case 'ath-del': {
      const a = athleteById(id);
      confirmSheet('Smazat závodníka?', `${fullName(a)} i všechny jeho výkony budou pryč.`, 'Smazat', () => {
        DB.athletes = DB.athletes.filter(x => x.id !== id);
        DB.results = DB.results.filter(r => r.athleteId !== id);
        sw.lineup = sw.lineup.filter(x => x !== id);
        save(); render(); toast('Smazáno.');
      }, true);
      break;
    }
    case 'import-open': importSheet(); break;
    case 'import-run': {
      const txt = $('#csvText').value;
      if (!txt.trim()) { toast('Vyber soubor nebo vlož seznam.'); break; }
      const n = importAthletes(txt, $('#csvGroup').value.trim());
      closeSheet(); render();
      toast(n ? `Naimportováno ${n} závodníků.` : 'Nic nového k importu — už tam všichni jsou.');
      break;
    }
    case 'export-ath':
      download('zavodnici.csv', toCSV([['Jméno', 'Příjmení', 'Třída', 'Pohlaví', 'Ročník', 'Poznámka'],
        ...athletesIn('').map(a => [a.first, a.last, a.group || '',
          a.sex === 'M' ? 'M' : a.sex === 'F' ? 'Ž' : '', a.year || '', a.note || ''])]));
      break;

    /* disciplíny */
    case 'disc-add': discSheet(null); break;
    case 'scale-open': scaleDraft = null; scaleSheet(id); break;
    case 'scale-sex': scaleCollect(); scaleSheet(id, b.dataset.v); break;
    case 'scale-clear': scaleDraft[scaleDraft.sex] = emptyScaleRows(); scaleSheet(id); break;
    case 'scale-save': {
      scaleCollect();
      const sd = discById(id);
      const any = k => scaleDraft[k].some(r => r.some(x => x != null));
      sd.scale = (any('M') || any('F')) ? { M: any('M') ? scaleDraft.M : null, F: any('F') ? scaleDraft.F : null } : null;
      scaleDraft = null;
      save(); closeSheet(); render();
      toast('Známkovací tabulka uložena.');
      break;
    }
    case 'disc-edit': discSheet(id); break;
    case 'disc-save': {
      const name = $('#dName').value.trim();
      if (!name) { toast('Disciplína potřebuje název.'); break; }
      const type = $('#dType').value;
      const o = {
        name, type,
        unit: type === 'time' ? 's' : ($('#dUnit').value.trim() || 'b'),
        dec: Number($('#dDec').value), attempts: Number($('#dAtt').value),
        better: $('#dBetter').value
      };
      if (id) Object.assign(discById(id), o);
      else DB.disciplines.push(Object.assign({ id: uid(), scale: null }, o));
      save(); closeSheet(); render(); toast('Uloženo.');
      break;
    }
    case 'disc-del': {
      const d = discById(id);
      confirmSheet('Smazat disciplínu?', `${d.name} i všechny zapsané výkony budou pryč.`, 'Smazat', () => {
        DB.disciplines = DB.disciplines.filter(x => x.id !== id);
        DB.results = DB.results.filter(r => r.discId !== id);
        if (state.discId === id) { state.discId = null; swReset(); }
        save(); render(); toast('Smazáno.');
      }, true);
      break;
    }

    /* výsledky */
    case 'res-open': resSheet(id); break;
    case 'res-save': {
      const r = DB.results.find(x => x.id === id), d = discById(r.discId);
      const v = parseValue(d, $('#rVal').value);
      if (v == null) { toast('Hodnota nedává smysl.'); break; }
      r.value = d.type === 'time' ? Math.round(v) : v;
      r.date = $('#rDate').value || r.date;
      r.note = $('#rNote').value.trim();
      save(); closeSheet(); render(); toast('Uloženo.');
      break;
    }
    case 'res-del': {
      const r = DB.results.find(x => x.id === id);
      confirmSheet('Smazat výkon?', 'Tenhle záznam zmizí.', 'Smazat', () => {
        DB.results = DB.results.filter(x => x.id !== id);
        save(); render(); toast('Smazáno.');
      }, true);
      break;
    }
    case 'res-mode': state.resMode = b.dataset.m; render(); break;
    case 'export-res': {
      const d = discById(state.resDisc);
      let rows = DB.results.filter(r => r.discId === state.resDisc);
      if (state.group) rows = rows.filter(r => { const a = athleteById(r.athleteId); return a && a.group === state.group; });
      rows.sort((a, c) => d.better === 'lower' ? a.value - c.value : c.value - a.value);
      download(`vysledky-${noAcc(d.name).replace(/[^a-z0-9]+/g, '-')}.csv`, toCSV(resultRows(rows)));
      break;
    }
    case 'export-all':
      if (!DB.results.length) { toast('Zatím není co exportovat.'); break; }
      download(`vykony-${todayISO()}.csv`, toCSV(resultRows(DB.results.slice().sort((a, c) => (a.date || '').localeCompare(c.date || '')))));
      break;
    case 'export-json':
      download(`zaloha-vykony-${todayISO()}.json`, JSON.stringify(DB), 'application/json');
      break;
    case 'send-mail': sendByMail(); break;
    case 'gs-push': gsPush(false); break;
    case 'gs-pull': gsPull(); break;
    case 'gs-test': gsTest(); break;
    case 'gs-open': {
      const u = (DB.settings.gsSheet || '').trim();
      if (u) window.open(u, '_blank'); else toast('Adresa tabulky není vyplněná.');
      break;
    }
    case 'import-json':
      pendingImport = null;
      openSheet('Načíst zálohu', `
        <p class="muted small" style="margin-top:0">Vyber soubor <b>zaloha-vykony-….json</b> — třeba přílohu z e-mailu, kterou sis nejdřív uložil do Souborů.</p>
        <label class="field"><span>Soubor zálohy</span><input type="file" id="jsonFile" accept=".json,application/json"></label>
        <div id="impInfo"></div>`);
      break;
    case 'import-replace':
      if (!pendingImport) break;
      DB = Object.assign(freshDB(), pendingImport);
      DB.settings = Object.assign(freshDB().settings, pendingImport.settings || {});
      state.discId = null; swReset(); save(); closeSheet(); render();
      toast(`Nastaveno: ${DB.athletes.length} závodníků, ${DB.disciplines.length} disciplín, ${DB.results.length} výkonů.`);
      pendingImport = null;
      break;
    case 'import-merge': {
      if (!pendingImport) break;
      const r = mergeDB(pendingImport);
      state.discId = null; swReset(); closeSheet(); render();
      toast(`Sloučeno · ${r.athletes} závodníků, ${r.discs} disciplín, přibylo ${r.results} výkonů.`);
      pendingImport = null;
      break;
    }

    /* nastavení */
    case 'set-toggle': {
      const k = b.dataset.k;
      DB.settings[k] = !DB.settings[k];
      save(); render();
      if (k === 'sound' && DB.settings.sound) beep(880, 90);
      break;
    }
    case 'wipe':
      confirmSheet('Smazat všechna data?', 'Závodníci, disciplíny i všechny výkony budou nenávratně pryč. Nejdřív si radši ulož zálohu.', 'Smazat vše', () => {
        DB = freshDB(); state.discId = null; swReset(); save(); render(); toast('Hotovo, čistý stůl.');
      }, true);
      break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'mDate') { state.date = t.value; render(); }
  if (t.id === 'resDisc') { state.resDisc = t.value; render(); }
  if (t.id === 'setCd') { DB.settings.countdown = Number(t.value); save(); render(); }
  if (t.dataset && t.dataset.split) {
    const s = sw.splits.find(x => x.id === t.dataset.split);
    if (s) s.athleteId = t.value || null;
  }
  if (t.id === 'csvFile') readFile(t.files[0], txt => { $('#csvText').value = txt; toast('Soubor načten, zkontroluj a potvrď.'); });
  if (t.id === 'setMail') { DB.settings.email = t.value.trim(); save(); }
  if (t.id === 'setGsUrl') { DB.settings.gsUrl = t.value.trim(); gs.error = ''; gs.suspend = true; save(); gs.suspend = false; }
  if (t.id === 'jsonFile') readFile(t.files[0], txt => {
    try {
      const d = JSON.parse(txt);
      if (!d || !Array.isArray(d.athletes) || !Array.isArray(d.disciplines)) throw 0;
      pendingImport = d;
      const grades = d.disciplines.filter(x => x.grades && x.grades.some(g => g != null)).length;
      $('#impInfo').innerHTML = `<div class="card" style="margin-top:4px">
          <div class="name">Záloha ${d.exported ? 'z ' + czDate(String(d.exported).slice(0, 10)) : ''}</div>
          <div class="sub muted small">${d.athletes.length} závodníků · ${d.disciplines.length} disciplín${grades ? ' (z toho ' + grades + ' se známkovými limity)' : ''} · ${(d.results || []).length} výkonů</div>
        </div>
        <button class="btn primary" data-act="import-replace">Nahradit vše zálohou</button>
        <button class="btn" data-act="import-merge" style="margin-top:10px">Přidat k současným datům</button>
        <p class="muted tiny" style="margin-top:12px">Sloučení nepřepíše, co už máš — doplní chybějící závodníky, disciplíny i výkony a přeskočí duplicity.</p>`;
    } catch (err) { toast('Tohle není platná záloha.'); }
  });
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'athSearch') { state.athFilter = t.value; const l = $('#athList'); if (l) l.innerHTML = athListHTML(); }
  if (t.id === 'mSession') state.session = t.value;
  if (t.id === 'setGsUrl') { DB.settings.gsUrl = t.value.trim(); gs.suspend = true; save(); gs.suspend = false; }
  if (t.id === 'setMail') { DB.settings.email = t.value.trim(); gs.suspend = true; save(); gs.suspend = false; }
});

document.addEventListener('click', e => {
  const c = e.target.closest('[data-act^="group-"]');
  if (!c) return;
  state.group = c.dataset.g;
  DB.settings.lastGroup = state.group; save();
  render();
});

/* pojistka: nechtěné opuštění běžícího měření */
window.addEventListener('beforeunload', e => {
  if (sw.phase === 'running' || (sw.phase === 'review' && sw.splits.length)) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------- start ---------- */
renderTabs();
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { }
  });
}

</script>
</body>
</html>
